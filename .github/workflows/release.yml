name: Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
        include:
          - os: windows
            ext: .exe
          - os: linux
            ext: ""
          - os: darwin
            ext: ""

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Build
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -v -o go-ws-proxy-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} main.go

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: go-ws-proxy-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
